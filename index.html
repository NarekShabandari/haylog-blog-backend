<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>polaroid Image Gallery</title>
    <link href="styles.css" rel="stylesheet" />
  </head>

  <body>
    <section class="gallery">
      <h1 class="gallery-title">Image Gallery</h1>

      <figure class="gallery-card">
        <img
          alt="Mountains"
          height="200"
          src="./Images/Mountains.jpg"
          width="200"
        />
        <figcaption class="gallery-card-caption">Mountains</figcaption>
      </figure>
      <figure class="gallery-card">
        <img
          alt="Building"
          height="200"
          src="./Images/Building.jpg"
          width="200"
        />
        <figcaption class="gallery-card-caption">Building</figcaption>
      </figure>
      <figure class="gallery-card">
        <img alt="Window" height="200" src="./Images/Window.jpg" width="200" />
        <figcaption class="gallery-card-caption">Window</figcaption>
      </figure>
      <figure class="gallery-card">
        <img alt="Bike" height="200" src="./Images/Bike.jpg" width="200" />
        <figcaption class="gallery-card-caption">Bike</figcaption>
      </figure>
    </section>

    <script src="script.js"></script>
  </body>
</html>
